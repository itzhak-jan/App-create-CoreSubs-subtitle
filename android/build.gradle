buildscript {
    ext {
        // compileSdk/buildTools 35 and AGP 8.6.0 (minimum Gradle 8.7, see the
        // wrapper) are required by androidx.media3 1.6.0+ (CanvasOverlay,
        // used by SubtitleExportModule.kt, was added in 1.6.0 — every version
        // with it needs compileSdk >= 35, and 1.10.1 needs 36, which would
        // additionally require AGP 9.x/Gradle 9.x; pinning Media3 to 1.9.1 in
        // app/build.gradle avoids that much bigger, riskier jump).
        buildToolsVersion = "35.0.0"
        minSdkVersion    = 26        // Android 8 minimum (Pixel 10 runs 15)
        compileSdkVersion = 35
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.22"
        // react-native-video's build.gradle reads this via its own
        // safeExtGet('media3Version'), which checks rootProject.ext first —
        // left unset, Gradle's dependency resolution across the whole app
        // picks the higher of RN-video's own declared version and the 1.9.1
        // our own Media3 modules declare (AudioChunkExtractorModule.kt,
        // SubtitleExportModule.kt) for every Media3 artifact, including the
        // ones RN-video actually uses (media3-exoplayer, media3-session).
        // RN-video's ExoPlayer wrapper then gets *compiled* against its own
        // older declared version but *runs* against 1.9.1's — confirmed via
        // real-device logcat as a NoSuchMethodError on DefaultLoadControl's
        // constructor the first time a video was selected, because that
        // constructor's signature isn't stable across Media3 versions.
        //
        // react-native-video was pinned at 6.4.5 (tested against Media3
        // 1.3.1) when this surfaced. Setting media3Version here just forces
        // 6.4.5 to *compile* against 1.9.1 too, which traded the runtime
        // crash for several compile errors instead — 6.4.5's source uses a
        // few other Media3 1.3.1-era APIs (direct DefaultLoadControl
        // subclassing, specific androidx.media3.session.R.drawable names)
        // that don't exist in 1.9.1 either. Upgraded react-native-video to
        // 6.19.3 instead of patching around each one individually: its
        // changelog shows the maintainers hit this same instability and
        // moved to DefaultLoadControl.Builder() (its own comment: "...
        // constructors are not stable"), with explicit "on 1.9+" handling
        // for the notification icon/buffered-bytes-accounting differences —
        // i.e. 6.19.3 is the upstream fix for the exact problem this
        // property works around. Kept this override set, since 6.19.3's own
        // tested default (1.8.0, see its gradle.properties) is still lower
        // than the 1.9.1 the rest of the app needs.
        media3Version = "1.9.1"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.6.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.facebook.react.rootproject"
