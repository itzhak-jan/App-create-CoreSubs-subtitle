apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    /* Autolinking handles most library linking. */
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.coresubsapp"

    defaultConfig {
        applicationId "com.coresubsapp"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // Pixel 10 Pro XL is arm64-v8a only — stripping other ABIs keeps APK
        // size manageable and prevents TFLite delegate mismatches.
        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    // MediaPipe LLM Inference ("Task Genai") — runs the translator model
    // (currently Gemma3-1B-IT, see TranslatorModule.kt) for on-device
    // English->Hebrew translation. Bundles its own LiteRT runtime
    // and GPU/NPU dispatch; no separate TFLite/NNAPI delegate wiring needed
    // (see TranslatorModule.kt for why this replaced a raw TFLite approach).
    implementation 'com.google.mediapipe:tasks-genai:0.10.27'

    // AndroidX Media3 — replaces ffmpeg-kit-react-native for both audio chunk
    // extraction and subtitle burn-in on export. ffmpeg-kit's native binaries
    // (com.arthenica:ffmpeg-kit-*) were pulled from every Maven repository
    // when that project retired (2026-04-01) — this app can no longer depend
    // on it at all. Media3 wraps Android's own MediaCodec/MediaMuxer, is
    // Google-maintained, and gets patched via normal Android/Play updates
    // rather than depending on a now-abandoned third-party C demuxer parsing
    // untrusted video files. See AudioChunkExtractorModule.kt and
    // SubtitleExportModule.kt for what each piece is used for.
    //
    // Pinned to 1.9.1, not the latest (1.10.1+): every Media3 version with
    // CanvasOverlay (added in 1.6.0, used by SubtitleExportModule.kt) needs
    // compileSdk >= 35 — already bumped above — but 1.10.1 specifically
    // needs compileSdk 36, which pulls in AGP 9.x/Gradle 9.x too. 1.9.1 is
    // the newest release confirmed (checked its constants.gradle on GitHub)
    // to still only need compileSdk 35, avoiding that much bigger jump.
    implementation 'androidx.media3:media3-transformer:1.9.1'
    implementation 'androidx.media3:media3-effect:1.9.1'
    implementation 'androidx.media3:media3-common:1.9.1'

    // Kotlin coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

// settings.gradle's applyNativeModulesSettingsGradle(settings) only wires up
// native library subprojects to `include()`. The counterpart call below is
// what actually generates PackageList.java (referenced from
// MainApplication.kt) into build/generated/rncli/ and adds that directory
// to the app module's Java source set — without it, PackageList is simply
// never generated and every reference to it fails to resolve. Both calls
// come from the same native_modules.gradle; the real react-native@0.74.5
// template applies both, one from settings.gradle and one from here.
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
