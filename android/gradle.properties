# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# React Native New Architecture
#
# Off: react-native-screens@3.34.0's Fabric/New-Architecture CMake build
# (gated behind RNS_NEW_ARCH_ENABLED, itself driven by this flag) links
# against ReactAndroid prefab targets — react_render_consistency,
# react_performance_timeline, react_render_observers_events — that don't
# exist in RN 0.74.5's own react-android AAR; those targets belong to a
# newer RN core than this project is pinned to. Same "scaffolded against a
# newer RN version" pattern as several earlier fixes this session
# (settings.gradle's autolinking syntax, gradlew, launcher icons). Nothing
# in this app's own code (JITProcessor/Whisper/Translator/Media modules,
# all classic bridge NativeModules) depends on Fabric/TurboModules, so
# turning New Architecture off avoids this whole class of cross-library
# version mismatches rather than chasing one dependency pin at a time.
# MainActivity.kt/MainApplication.kt already branch on this flag via
# DefaultNewArchitectureEntryPoint — no code changes needed to disable it.
newArchEnabled=false
hermesEnabled=true
