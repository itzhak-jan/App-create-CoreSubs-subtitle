# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# React Native New Architecture
newArchEnabled=true
hermesEnabled=true

# ── ffmpeg-kit package variant ────────────────────────────────────────────────
#
# "video" selects the LGPL-licensed prebuilt that includes:
#   libass       — ASS/SRT subtitle rendering engine
#   libfribidi   — Unicode BiDi algorithm (required for RTL Hebrew)
#   libfreetype  — TrueType font rasteriser
#   libfontconfig — font discovery (we override with force_style + fontsdir)
#
# This variant does NOT include libx264 (GPL). The export pipeline uses
# h264_mediacodec (Android hardware encoder) instead, which is faster and
# does not carry a GPL licence requirement.
#
# Alternatives:
#   video-gpl — same as video + libx264/libx265 (adds GPL requirement)
#   full      — all LGPL libs (larger APK, ~60 MB extra)
#   full-gpl  — all libs including GPL (largest; only if libx265 is needed)
ffmpegKitPackage=video
